# Рекомендуемая конфигурация: символьные n-граммы меток + лексические признаки,
# логистическая регрессия. Модель обучается так:
#   python scripts/train_classifier.py \
#       --annotations data/labeled/annotations_v1.csv \
#       --backend tfidf_logreg --run-id exp_tfidf --no-sbert --group-split
# Если модель обучена с SBERT (без --no-sbert), добавь экстрактор sbert ниже.

run_id: exp_tfidf
taxonomy: configs/taxonomy.yaml

parser:
  name: freemind
  options: {}

pairing:
  name: parent_child
  options: {}

features:
  - name: lexical_simple
    options: {}
  - name: topology        # считается и сохраняется в 03_features.csv, моделью не используется
    options: {}

classifier:
  name: sklearn
  options:
    backend: tfidf_logreg
    model_path: models/exp_tfidf.joblib

exporters:
  - name: graphml
    options: {}
  - name: jsonld
    options:
      base_iri: "https://mindmap2kg.org/v1/"

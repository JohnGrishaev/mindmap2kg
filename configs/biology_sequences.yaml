# Курируемый набор последовательных биологических процессов.
# Источник класса `precedes` без LLM: Wikidata этот класс не покрывает,
# а у автора ВКР нет доступа к API LLM-провайдеров.
#
# Структура: для каждого процесса — упорядоченный список этапов.
# Соседние этапы превращаются в пары "u precedes v" скриптом
# scripts/seed_precedes.py.
#
# Источники этапов: школьные/университетские учебники биологии
# (Кэмпбелл «Биология», ОГЭ/ЕГЭ программа, Википедия — статьи о каждом процессе).
# Это не «эксперт сел и написал» — это перепроверяемый список общеизвестных
# фактов школьной программы. В тексте ВКР это честно описывается как
# «курируемый набор онтологических цепочек на основе учебной литературы».

version: "0.1"
source: "curated_textbook"

processes:

  # ============ КЛЕТОЧНЫЕ ПРОЦЕССЫ ============
  - topic: митоз
    stages: [интерфаза, профаза, метафаза, анафаза, телофаза, цитокинез]

  - topic: мейоз
    stages:
      - интерфаза
      - профаза I
      - метафаза I
      - анафаза I
      - телофаза I
      - профаза II
      - метафаза II
      - анафаза II
      - телофаза II

  - topic: клеточный цикл
    stages: [G1-фаза, S-фаза, G2-фаза, M-фаза]

  - topic: апоптоз
    stages: [инициация, активация каспаз, фрагментация ДНК, фагоцитоз]

  # ============ БИОЭНЕРГЕТИКА ============
  - topic: фотосинтез
    stages: [световая фаза, фотолиз воды, синтез АТФ, темновая фаза, фиксация углерода]

  - topic: клеточное дыхание
    stages: [гликолиз, окислительное декарбоксилирование, цикл Кребса, окислительное фосфорилирование]

  - topic: гликолиз
    stages:
      - фосфорилирование глюкозы
      - изомеризация
      - расщепление на триозы
      - окисление и фосфорилирование
      - образование пирувата

  - topic: цикл Кребса
    stages:
      - образование цитрата
      - изомеризация в изоцитрат
      - окисление в альфа-кетоглутарат
      - образование сукцинил-КоА
      - образование сукцината
      - образование фумарата
      - образование малата
      - регенерация оксалоацетата

  # ============ МОЛЕКУЛЯРНАЯ БИОЛОГИЯ ============
  - topic: репликация ДНК
    stages:
      - инициация
      - расплетение двойной спирали
      - синтез праймера
      - элонгация
      - удаление праймера
      - лигирование фрагментов

  - topic: транскрипция
    stages: [инициация, элонгация, терминация, процессинг РНК]

  - topic: трансляция
    stages: [инициация, элонгация, терминация, посттрансляционная модификация]

  - topic: синтез белка
    stages: [транскрипция, процессинг РНК, трансляция, фолдинг белка]

  # ============ РАЗВИТИЕ ОРГАНИЗМА ============
  - topic: эмбриогенез
    stages: [оплодотворение, дробление, бластуляция, гаструляция, нейруляция, органогенез]

  - topic: оплодотворение
    stages:
      - капацитация сперматозоидов
      - акросомная реакция
      - проникновение в яйцеклетку
      - слияние ядер

  - topic: онтогенез
    stages: [эмбриональный период, постэмбриональный период, репродуктивный период, старение]

  - topic: развитие лягушки
    stages: [икринка, эмбрион, головастик с наружными жабрами, головастик с внутренними жабрами, лягушонок, взрослая лягушка]

  - topic: метаморфоз бабочки
    stages: [яйцо, гусеница, куколка, имаго]

  # ============ ФИЗИОЛОГИЯ ============
  - topic: пищеварение у человека
    stages: [ротовая полость, глотка, пищевод, желудок, тонкий кишечник, толстый кишечник]

  - topic: свёртывание крови
    stages:
      - повреждение сосуда
      - спазм сосуда
      - адгезия тромбоцитов
      - агрегация тромбоцитов
      - активация каскада свёртывания
      - образование фибрина
      - формирование тромба

  - topic: дыхательный цикл
    stages: [вдох, газообмен в лёгких, транспорт кислорода, газообмен в тканях, выдох]

  - topic: сердечный цикл
    stages: [систола предсердий, систола желудочков, диастола]

  # ============ ИММУНИТЕТ ============
  - topic: иммунный ответ
    stages:
      - распознавание антигена
      - презентация антигена
      - активация T-хелперов
      - пролиферация B-клеток
      - выработка антител
      - элиминация антигена
      - формирование клеток памяти

  - topic: воспалительная реакция
    stages: [повреждение ткани, выброс медиаторов, расширение сосудов, миграция лейкоцитов, фагоцитоз, регенерация]

  # ============ ЭКОЛОГИЯ И ЭВОЛЮЦИЯ ============
  - topic: первичная сукцессия
    stages: [голая порода, корковые лишайники, мхи, травы, кустарники, лиственный лес, климаксное сообщество]

  - topic: вторичная сукцессия
    stages: [нарушенный участок, травы, кустарники, мелколиственный лес, широколиственный лес]

  - topic: эволюция по Дарвину
    stages: [изменчивость, наследственность, борьба за существование, естественный отбор, видообразование]

  - topic: видообразование
    stages: [исходная популяция, географическая изоляция, дивергенция признаков, репродуктивная изоляция, новый вид]

  # ============ ГЕНЕТИКА ============
  - topic: гаметогенез
    stages: [период размножения, период роста, период созревания, период формирования]

  - topic: сперматогенез
    stages: [сперматогоний, сперматоцит I порядка, сперматоцит II порядка, сперматида, сперматозоид]

  - topic: оогенез
    stages: [оогоний, ооцит I порядка, ооцит II порядка, яйцеклетка]

# =============================================================================
# Таксономия семантических связей для проекта mindmap2kg
# =============================================================================
# Соответствует множеству R = {r_1, ..., r_n} из формальной постановки задачи
# (раздел 1.3.1 ВКР).
#
# Соглашения:
#   * Связь именуется с точки зрения РОДИТЕЛЯ (u) к ПОТОМКУ (v),
#     то есть в том направлении, как ребро нарисовано в mind-map.
#     Пример: пара "Клетка → Митохондрия" имеет relation=has_part.
#   * fallback-класс associated_with используется для пар, которые
#     не подходят ни под один содержательный класс.
#   * conceptnet_source перечисляет предикаты ConceptNet/RuWordNet,
#     из которых можно автоматически собирать синтетические примеры.
#     Флаг invert=true означает, что в исходном источнике направление
#     обратное и при импорте нужно поменять (u, v) местами.
#
# Версионирование: при изменении состава или семантики классов
# увеличиваем version. Все артефакты (annotations.parquet, обученные
# модели) хранят taxonomy_version, чтобы не смешивать несовместимые данные.
# =============================================================================

version: "0.1"
domain: biology
language: ru

fallback: associated_with

relations:

  - id: has_part
    label_ru: "имеет часть"
    description: >
      Мереологическая связь "целое → часть". Родительский узел представляет
      объект или систему, дочерний — её структурную составляющую.
    examples:
      - ["Клетка", "Митохондрия"]
      - ["Растение", "Корень"]
      - ["Сердце", "Желудочек"]
      - ["Экосистема", "Биогеоценоз"]
    conceptnet_source:
      - predicate: "/r/PartOf"
        invert: true       # PartOf(A,B) = "A is part of B", нам нужно B → A
      - predicate: "/r/HasA"
        invert: false

  - id: has_example
    label_ru: "имеет пример / включает"
    description: >
      Родо-видовая связь "общее → частное". Родительский узел — категория
      или класс, дочерний — конкретный представитель или подкласс.
    examples:
      - ["Млекопитающее", "Кошка"]
      - ["Фермент", "Амилаза"]
      - ["Углевод", "Глюкоза"]
      - ["Хордовые", "Позвоночные"]
    conceptnet_source:
      - predicate: "/r/IsA"
        invert: true       # IsA(A,B) = "A is a B", нам нужно B → A
      - predicate: "/r/InstanceOf"
        invert: true

  - id: has_property
    label_ru: "имеет свойство"
    description: >
      Связь объект → его характеристика, признак или атрибут.
      Свойство не является самостоятельной сущностью или частью объекта.
    examples:
      - ["Вода", "Прозрачность"]
      - ["Кровь", "Жидкое состояние"]
      - ["ДНК", "Двуспиральность"]
      - ["Мембрана", "Полупроницаемость"]
    conceptnet_source:
      - predicate: "/r/HasProperty"
        invert: false

  - id: has_function
    label_ru: "имеет функцию / используется для"
    description: >
      Связь объект → его функция, назначение или то, что он делает.
      Особенно важна в биологии (функции органов, органелл, веществ).
    examples:
      - ["Митохондрия", "Синтез АТФ"]
      - ["Лёгкие", "Газообмен"]
      - ["Хлорофилл", "Фотосинтез"]
      - ["Фермент", "Катализ реакции"]
    conceptnet_source:
      - predicate: "/r/UsedFor"
        invert: false
      - predicate: "/r/CapableOf"
        invert: false

  - id: causes
    label_ru: "вызывает / приводит к"
    description: >
      Каузальная связь "причина → следствие". Родительский узел —
      фактор, агент или процесс, дочерний — результат его действия.
    examples:
      - ["Вирус", "Заболевание"]
      - ["Мутация", "Изменение фенотипа"]
      - ["Недостаток инсулина", "Гипергликемия"]
      - ["УФ-излучение", "Повреждение ДНК"]
    conceptnet_source:
      - predicate: "/r/Causes"
        invert: false

  - id: precedes
    label_ru: "предшествует / переходит в"
    description: >
      Темпоральная или этапная связь "стадия → следующая стадия".
      Применяется для процессов, разбитых на упорядоченные фазы.
    examples:
      - ["Профаза", "Метафаза"]
      - ["Митоз", "Цитокинез"]
      - ["Транскрипция", "Трансляция"]
      - ["Опыление", "Оплодотворение"]
    conceptnet_source:
      - predicate: "/r/HasSubevent"
        invert: false
      - predicate: "/r/HasPrerequisite"
        invert: true       # HasPrerequisite(A,B) = "B нужно до A", нам нужно B → A

  - id: associated_with
    label_ru: "связано с (прочее)"
    description: >
      Fallback-класс. Используется, когда между понятиями есть смысловая
      связь, но она не соответствует ни одному из содержательных типов.
      При оценке модели метрики по этому классу указываются отдельно
      и не входят в основной macro-F1.
    examples:
      - ["Биология", "Дарвин"]
      - ["Генетика", "Этика"]
    conceptnet_source:
      - predicate: "/r/RelatedTo"
        invert: false

# =============================================================================
# Метрики и пороги (используются в scripts/evaluate.py)
# =============================================================================
evaluation:
  primary_metric: macro_f1
  exclude_from_primary: [associated_with]   # fallback не учитывается в основной F1
  target_f1: 0.85                            # целевой порог из ВКР (раздел 1.3.4)
  per_class_min_examples: 50                 # если в классе < 50 примеров — warning
